[project]
name = "mambaglue"
description = "MambaGlue: Fast and Robust Local Feature Matching With Mamba"
version = "0.1"
authors = [
    {name = "Kihwan Ryoo"},
    {name = "Hyungtae Lim"},
    {name = "Hyun Myung"},
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "feature-matching",
    "local-features",
    "mamba",
    "state-space-model",
    "transformer",
    "computer-vision",
    "structure-from-motion",
    "visual-localization",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "einops>=0.8,<1",
    "kornia>=0.6.11,<1",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "omegaconf>=2.3,<3",
    "opencv-python>=4.10,<5",
    "requests>=2.31,<3",
    "torch==2.6.0",
    "torchvision==0.21.0",
]

[project.urls]
Repository = "https://github.com/url-kaist/MambaGlue"
Issues = "https://github.com/url-kaist/MambaGlue/issues"
Paper = "https://arxiv.org/abs/2502.00462"
"Glue Factory branch" = "https://github.com/url-kaist/MambaGlue/tree/glue-factory"
"hloc branch" = "https://github.com/url-kaist/MambaGlue/tree/hloc"

[project.optional-dependencies]
dev = ["black==23.12.1", "flake8", "isort"]
onnx = ["onnx>=1.16", "onnxruntime-gpu==1.22.0"]
# Training reproduction extras. `gluefactory` itself is not installable from
# PyPI; install it separately (editable from a local clone or directly from
# https://github.com/cvg/glue-factory). See mambaglue/training/README.md.
train = ["h5py", "tensorboard", "pytlsd"]

[project.scripts]
mambaglue-smoke = "mambaglue.smoke:main"
mambaglue-export-onnx = "mambaglue.onnx_export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mambaglue", "mambaglue.training"]
include-package-data = true

[tool.setuptools.package-data]
"mambaglue.training" = ["configs/*.yaml", "run.sh"]

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.isort]
profile = "black"
